<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Isometra&family=Ruwudu&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="site-header">
        <h1>˗ˏˋ ꒰ ✉︎ ꒱ ˎˊ˗</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="story.html">My Favorite Story</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="back-note">
            <h7><center><p class="upside-down">⋆⊱༻𖥸༺⊰⋆</p></center></h7>
        </section>

        <section class="letter container">

            <div class="letter-top">✉</div>

            <h6>ᯓ Contact Us ⌲</h6>

            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">❁ Your Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Write your name here...">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">❁ Your Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Write your email here...">
                </div>

                <div class="terms">
                    <p>⌲ Do you agree to the terms of agreement?</p>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="yes" name="terms" value="yes">
                        <label class="form-check-label" for="yes">Yes, I agree</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="no" name="terms" value="no">
                        <label class="form-check-label" for="no">No, I do not agree</label>
                    </div>
                </div>

                <input type="submit" value="Submit" class="btn letter-button">
            </form>

            <p class="letter-ending">
                With love,<br>
                <span>♡ꕥ♡</span>
            </p>

            <div class="letter-stamp">˖᯽˖</div>

        </section>

        <section class="back-note">
            <h7><p><center>⋆⊱༻𖥸༺⊰⋆</center></p></h7>
        </section>

    </main>

    <footer id="site-footer">
        <p>˖᯽ ݁˖˖᯽ ݁˖˖᯽ ݁˖</p>
    </footer>

</body>
</html>
