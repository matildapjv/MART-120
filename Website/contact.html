<head>

</head>

<body>

    <header>

        <h1>˗ˏˋ ꒰ ✉︎ ꒱ ˎˊ˗</h1>

        <p class="subtitle">
        </p>

        <nav>
            <a href="home.html">Home</a>
            <a href="story.html">My Favorite Story</a>
            <a href="contact.html">Contact Me</a>
        </nav>

    </header>


    <main>
                <section class="back-note">

            <h7><center><p class = "upside-down">⋆⊱༻𖥸༺⊰⋆</p></center></h7>
        </section>

        <section class="letter">

            <div class="letter-top">
                ✉
            </div>


            <p class="letter-date">

            <h6>ᯓ Contact Us ⌲</h6>


            <form>

                <label for="name">
                    ❁ Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Write your name here..."
                required>


                <label for="email">
                    ❁ Your Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Write your email here..."
                required>


                <div class="terms">

                    <p>
                        ⌲ Do you agree to the terms of agreement?
                    </p>


                    <input
                        type="radio"
                        id="yes"
                        name="terms"
                        value="yes"
                    required>
                    

                    <label for="yes">
                        Yes, I agree
                    </label>


                    <br>


                    <input
                        type="radio"
                        id="no"
                        name="terms"
                        value="no"
                    >

                    <label for="no">
                        No, I do not agree
                    </label>

                </div>


                <input
                    type="submit"
                    value="Submit"
                    class="letter-button"
                >

            </form>


            <p class="letter-ending">
                With love,<br>
                <span>♡ꕥ♡</span>
            </p>


            <div class="letter-stamp">
                ˖᯽˖
            </div>

        </section>


        <section class="back-note">

            <h7><p><center>⋆⊱༻𖥸༺⊰⋆</center></p></h7>

        </section>

    </main>
